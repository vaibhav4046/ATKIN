name: "Release Desktop Application"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action creates/updates the draft release and uploads its assets, which
# needs write access; the repo default token is read-only.
permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Tag pushes publish a draft release. Manual runs only build and upload the
      # bundles as workflow artifacts, so they never touch a published release.
      - name: Build Tauri Desktop Binary
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Atkin {0}', github.ref_name) || '' }}
          releaseBody: 'Atkin sovereign legal AI workspace, desktop build.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundles (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: atkin-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
